name: ofertas

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ofertas
      POSTGRES_PASSWORD: ofertas
      POSTGRES_DB: ofertas
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ofertas"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    volumes:
      - redisdata:/data

  # Storage S3 entra na Fase 4 (criativos).

volumes:
  pgdata:
  redisdata:
