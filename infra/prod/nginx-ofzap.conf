# nginx do host repassando para o OfZap (usar com docker-compose.nginx.yml).
# Copie para /etc/nginx/conf.d/ofzap.conf, rode `nginx -t && systemctl reload nginx`
# e depois `certbot --nginx -d painel.ofzap.com.br -d api.ofzap.com.br -d go.ofzap.com.br`.

map $http_upgrade $ofz_connection {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name painel.ofzap.com.br;
    client_max_body_size 110m;
    # Painel só abre destes IPs (API e links curtos continuam públicos).
    allow 189.90.45.133;
    allow 189.90.37.78;
    deny all;
    location / {
        proxy_pass http://127.0.0.1:8100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $ofz_connection;
    }
}

# API: MCP dos agentes (streaming), webhooks, imagens e uploads de vídeo.
server {
    listen 80;
    server_name api.ofzap.com.br;
    client_max_body_size 110m;
    location / {
        proxy_pass http://127.0.0.1:8101;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $ofz_connection;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}

# Links curtos e convites.
server {
    listen 80;
    server_name go.ofzap.com.br;
    location / {
        proxy_pass http://127.0.0.1:8102;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
